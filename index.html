<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perpetual Calendar</title>
<style>
:root{
  --bg:#0d1117;--panel:#151b24;--panel2:#1c2430;--text:#f4f7fb;--muted:#9da9b8;
  --accent:#7c9cff;--line:#2a3442;--today:#283c66;--holiday:#332744;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:radial-gradient(circle at 20% 0%,#1d2740 0,transparent 34%),
             radial-gradient(circle at 90% 20%,#241a3a 0,transparent 30%),var(--bg);
}
.app{width:min(1100px,94vw);margin:auto;padding:22px 0 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:-.04em}
.subtitle{color:var(--muted);margin-top:4px}
button,select,input,textarea{font:inherit}
button{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;
  padding:10px 14px;cursor:pointer;transition:.15s;
}
button:hover{background:var(--panel2);transform:translateY(-1px)}
.today-btn{border-color:#526da9;background:#1a2640;white-space:nowrap}
.picker{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px;
  background:rgba(21,27,36,.92);border:1px solid var(--line);border-radius:22px;
  margin-bottom:14px;
}
.wheel-wrap{position:relative;text-align:center}
.wheel-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
.wheel{
  position:relative;height:174px;overflow-y:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;
  border-radius:16px;background:linear-gradient(180deg,var(--panel2),#111720);
  border:1px solid var(--line);padding:59px 0;
}
.wheel::-webkit-scrollbar{display:none}
.wheel:before,.wheel:after{content:"";position:absolute;left:8px;right:8px;height:52px;pointer-events:none;z-index:2}
.wheel:before{top:0;background:linear-gradient(var(--panel),transparent)}
.wheel:after{bottom:0;background:linear-gradient(transparent,var(--panel))}
.wheel-item{height:52px;display:flex;align-items:center;justify-content:center;color:#687586;font-size:1rem;user-select:none}
.wheel-item.selected{color:var(--text);font-size:1.15rem;font-weight:750}
.wheel-highlight{
  position:absolute;left:8px;right:8px;top:80px;height:52px;border-top:2px solid #52617a;
  border-bottom:2px solid #52617a;border-radius:10px;pointer-events:none;z-index:3;
}
#yearWheel .wheel-item{height:42px}
#yearWheel{padding:66px 0}
#yearWheel .wheel-highlight{top:80px}
.selected-date{text-align:center;color:var(--muted);margin:0 0 12px}
.selected-date strong{color:var(--text)}
.view-switch{
  display:flex;gap:5px;width:max-content;margin:0 auto 12px;padding:4px;
  background:#111720;border:1px solid var(--line);border-radius:13px;
}
.view-btn{min-width:92px;padding:8px 14px;border:0;background:transparent;color:var(--muted);font-weight:750}
.view-btn.active{background:#273b62;color:var(--text)}
.calendar-card{background:rgba(21,27,36,.94);border:1px solid var(--line);border-radius:24px;padding:18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cal-title{text-align:center;flex:1}.cal-title h2{margin:0;font-size:clamp(1.4rem,4vw,2.1rem)}
.cal-title p{margin:3px 0 0;color:var(--muted)}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;color:var(--muted);font-size:.72rem;padding:7px 0}
.day{
  min-height:70px;border:1px solid var(--line);border-radius:11px;background:#121821;
  padding:7px;position:relative;cursor:pointer;
}
.day:hover{background:#1a222e}.day.empty{background:transparent;border-color:transparent;cursor:default}
.day-num{font-weight:700}.day.selected{outline:2px solid var(--accent);background:var(--today)}
.day.holiday{background:var(--holiday)}
.day.has-event{border-color:#45649e;background:#182844}
.holiday-name,.calendar-event{
  position:absolute;left:6px;right:5px;bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.62rem
}
.holiday-name{color:#d6b9ff}.calendar-event{bottom:20px;color:#c9d7ff}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;margin-top:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--holiday);border:1px solid #755a91}
.year-view{display:none;margin-bottom:14px;padding:14px;background:#111720;border:1px solid var(--line);border-radius:18px}
.year-view.open{display:block}
.year-view-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.year-view-head h3{margin:0}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mini-month{border:1px solid var(--line);border-radius:13px;padding:9px;background:#141b25}
.mini-month-title{font-weight:800;margin-bottom:7px}.mini-week,.mini-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-week{margin-bottom:3px}.mini-week span{text-align:center;color:var(--muted);font-size:.58rem}
.mini-day{min-height:25px;border:0;border-radius:5px;background:transparent;color:var(--text);font-size:.62rem;padding:2px;position:relative}
.mini-day.note-day{background:#243653;box-shadow:inset 0 -2px 0 #7c9cff}
.mini-day.today-day{outline:2px solid #7c9cff}.mini-day.holiday-day{background:#332744}
.mini-day .note-dot{position:absolute;right:2px;bottom:2px;width:4px;height:4px;border-radius:50%;background:#c49aff}
.year-note-list{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.year-note-item{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid #222c3a}
.year-note-date{min-width:72px;color:#aab6c8;font-size:.76rem}.year-note-text{font-weight:650}
.countdowns-panel{margin-top:14px;padding:15px;background:#111720;border:1px solid var(--line);border-radius:18px}
.countdowns-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.countdowns-head h3{margin:0}
.countdowns-head span{color:var(--muted);font-size:.8rem}.countdown-list{display:grid;gap:9px;margin-top:10px}
.countdown-card{position:relative;padding:13px;border-radius:14px;border:1px solid var(--card-color);background:linear-gradient(135deg,#17202c,#111720)}
.countdown-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:14px 0 0 14px;background:var(--card-color)}
.countdown-title{font-weight:800;padding-right:30px}.countdown-target{color:var(--muted);font-size:.78rem;margin-top:2px}
.countdown-time{display:flex;gap:8px;margin-top:10px}.countdown-unit{min-width:58px;text-align:center}
.countdown-number{font-size:1.15rem;font-weight:800}.countdown-label{font-size:.62rem;color:var(--muted)}
.delete-countdown{position:absolute;right:8px;top:8px;padding:3px 8px;border:0;background:transparent;color:#ffbdc6;font-size:1.2rem}
.empty-countdowns{color:var(--muted);font-size:.86rem;padding:5px 0}
.info{margin-top:14px;padding:13px 15px;background:#111720;border:1px solid var(--line);border-radius:16px;color:var(--muted)}
.info strong{color:var(--text)}.info-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.info-action{border-radius:10px;padding:7px 10px;font-size:.82rem;background:#182236;border-color:#3c537c}
.editor-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:90}
.editor-backdrop.open{display:block}
.event-panel{
  display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(720px,92vw);max-height:90vh;overflow:auto;margin:0;padding:17px;
  background:#111720;border:1px solid #3b4b63;border-radius:18px;z-index:100;
  box-shadow:0 24px 80px rgba(0,0,0,.55)
}
.event-panel.open{display:block}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.editor-head h3{margin:0}.close-editor{width:42px;height:42px;padding:0;font-size:1.3rem}
.date-note-list{display:grid;gap:8px;margin-top:10px}
.date-note{
  display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:#151b24;color:var(--text)
}
.date-note-title{font-weight:750}.date-note-meta{color:var(--muted);font-size:.75rem;margin-top:2px}
.add-note-btn{width:100%;margin-top:10px;border-color:#526da9;background:#1b2944;font-weight:750}
.quick-add{margin:4px 0 13px}.quick-add-label{font-size:.76rem;color:var(--muted);margin-bottom:7px}
.quick-add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.quick-add-btn{min-height:40px;padding:7px 4px;font-size:.75rem;font-weight:700;background:#151d29}
.quick-add-btn.active{border-color:#5577bd;background:#1b2944}
.event-grid{display:grid;grid-template-columns:1fr 180px;gap:10px}
.notes{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#151b24;color:var(--text);padding:11px;outline:none}
.repeat-select{width:100%;height:45px;border:1px solid var(--line);border-radius:12px;background:#151b24;color:var(--text);padding:0 9px}
.event-actions{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;margin-top:13px}
.age-toggle,.countdown-option{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}
.age-toggle{grid-column:1/-1}.countdown-option{grid-column:1}
.countdown-option input,.age-toggle input{width:18px;height:18px;accent-color:var(--accent)}
.countdown-clock-btn{
  grid-column:2;width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:12px;
  border:1px solid #3a475a;background:#18202c;color:#667386;cursor:not-allowed;opacity:.55
}
.countdown-clock-btn.enabled{color:var(--accent);border-color:#5577bd;background:#1b2b49;cursor:pointer;opacity:1}
.countdown-clock-btn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.native-time-input{position:absolute;width:1px;height:1px;opacity:0}
.event-bottom-actions{grid-column:1/-1;display:flex;gap:9px;align-items:center}
.event-bottom-actions #clearEvent{margin-right:auto}
.save-event{background:#24345c;border-color:#526da9;font-weight:750}
.delete-note{background:#3a2028;border-color:#75404c;color:#ffdce2;font-weight:750}
.delete-note:disabled{opacity:.35;cursor:not-allowed}
.event-preview{margin-top:10px;color:var(--muted);font-size:.84rem}
@media(max-width:700px){
  .app{padding-top:15px}.header-actions{display:flex}.subtitle{font-size:.88rem}
  .picker{gap:6px;padding:8px}.wheel{height:164px;padding:54px 0}.wheel-highlight{top:75px}
  .wheel-item{height:52px;font-size:.9rem}.wheel-item.selected{font-size:1.08rem}
  #yearWheel{padding:61px 0}#yearWheel .wheel-highlight{top:75px}
  .calendar-card{padding:11px}.day{min-height:60px;padding:6px;font-size:.84rem}.holiday-name{font-size:.54rem}
  .calendar-event{font-size:.54rem;bottom:18px}.year-grid{grid-template-columns:repeat(2,1fr)}
  .event-grid{grid-template-columns:1fr}.event-panel{padding:14px}.quick-add-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:460px){
  .year-grid{grid-template-columns:1fr}.day{min-height:56px}.countdown-unit{min-width:52px}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div><h1>Perpetual Calendar</h1><div class="subtitle">Choose any date from 1500 through 3000</div></div>
  <div class="header-actions"><button class="today-btn" id="todayBtn">Today</button></div>
</header>

<section class="picker" aria-label="Date picker">
  <div class="wheel-wrap"><div class="wheel-label">Year</div><div class="wheel" id="yearWheel"></div><div class="wheel-highlight"></div></div>
  <div class="wheel-wrap"><div class="wheel-label">Month</div><div class="wheel" id="monthWheel"></div><div class="wheel-highlight"></div></div>
  <div class="wheel-wrap"><div class="wheel-label">Day</div><div class="wheel" id="dayWheel"></div><div class="wheel-highlight"></div></div>
</section>

<p class="selected-date" id="selectedDate"></p>

<div class="view-switch" aria-label="Calendar view">
  <button class="view-btn active" id="monthViewBtn" type="button">Month</button>
  <button class="view-btn" id="yearViewBtn" type="button">Year</button>
</div>

<section class="year-view" id="yearView">
  <div class="year-view-head"><h3 id="yearViewTitle"></h3><button type="button" id="yearTodayBtn">Today</button></div>
  <div class="year-grid" id="yearGrid"></div>
  <div class="year-note-list" id="yearNoteList"></div>
</section>

<section class="calendar-card calendar-focus-target" id="calendarCard">
  <div class="cal-head">
    <button type="button" id="prevMonth" aria-label="Previous month">‹</button>
    <div class="cal-title"><h2 id="calTitle"></h2><p id="calSubtitle"></p></div>
    <button type="button" id="nextMonth" aria-label="Next month">›</button>
  </div>
  <div class="week" id="week"></div>
  <div class="days" id="days"></div>
  <div class="legend"><span><i class="dot"></i>Holiday / observance</span><span>Tap any date for notes</span></div>
</section>

<section class="info" id="dateInfo"></section>

<section class="countdowns-panel" aria-label="Countdown Clocks">
  <div class="countdowns-head"><h3>Countdown Clocks</h3><span id="countdownCount"></span></div>
  <div class="countdown-list" id="countdownList"></div>
</section>
</div>

<div class="editor-backdrop" id="editorBackdrop"></div>
<section class="event-panel" id="eventEditor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
  <div class="editor-head"><h3 id="editorTitle">Notes for this date</h3><button class="close-editor" id="closeEditor" type="button" aria-label="Close">×</button></div>

  <div id="dateNoteArea">
    <div class="date-note-list" id="dateNoteList"></div>
    <button class="add-note-btn" id="addNoteBtn" type="button">＋ Add note</button>
  </div>

  <div id="noteForm" style="display:none">
    <div class="quick-add">
      <div class="quick-add-label">Category</div>
      <div class="quick-add-grid">
        <button class="quick-add-btn" type="button" data-quick="birthday">Birthday</button>
        <button class="quick-add-btn" type="button" data-quick="anniversary">Anniversary</button>
        <button class="quick-add-btn" type="button" data-quick="trip">Trip</button>
        <button class="quick-add-btn" type="button" data-quick="retirement">Retirement</button>
        <button class="quick-add-btn" type="button" data-quick="custom">Custom</button>
        <span></span>
      </div>
    </div>

    <div class="event-grid">
      <textarea class="notes" id="noteInput" placeholder="Enter your note"></textarea>
      <select class="repeat-select" id="repeatSelect" aria-label="Repeat">
        <option value="none">Does not repeat</option>
        <option value="daily">Every day</option>
        <option value="weekly">Every week</option>
        <option value="monthly">Every month</option>
        <option value="yearly">Every year</option>
      </select>
    </div>

    <div class="event-actions">
      <label class="age-toggle"><input type="checkbox" id="ageToggle"> Track age / years for yearly birthday or anniversary</label>
      <label class="countdown-option"><input type="checkbox" id="countdownToggle"> Add countdown clock</label>
      <button class="countdown-clock-btn" id="countdownClockButton" type="button" disabled aria-label="Set countdown time" title="Select Add countdown clock first">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3.5 2"></path></svg>
      </button>
      <input class="native-time-input" id="countdownTime" type="time" value="00:00" aria-label="Countdown time">
      <div class="event-bottom-actions">
        <button type="button" id="clearEvent">Exit</button>
        <button type="button" class="delete-note" id="deleteNote" disabled>Delete</button>
        <button type="button" class="save-event" id="saveEvent">Save note</button>
      </div>
    </div>
    <div class="event-preview" id="eventPreview"></div>
  </div>
</section>

<script>
(() => {
  "use strict";

  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const YEAR_MIN=1500, YEAR_MAX=3000, WHEEL_CYCLES=9, MID=Math.floor(WHEEL_CYCLES/2);
  const EVENT_KEY="perpetualCalendarEvents_v2", COUNTDOWN_KEY="perpetualCalendarCountdowns_v2";
  const COLORS={birthday:"#4f8cff",anniversary:"#e85d68",trip:"#4fbf7a",retirement:"#e4b84d",custom:"#f29a3f"};

  const fixedHolidays={"1-1":"New Year's Day","2-14":"Valentine's Day","7-4":"Independence Day","10-31":"Halloween","12-25":"Christmas Day"};
  const $=id=>document.getElementById(id);

  const now=new Date(); now.setHours(12,0,0,0);
  const state={year:now.getFullYear(),month:now.getMonth(),day:now.getDate()};
  let calendarView="month", editingId=null, selectedType="custom";

  function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
  function dateObj(y,m,d,h=12,min=0){return new Date(y,m,d,h,min,0,0)}
  function iso(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
  function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
  function loadEvents(){try{return JSON.parse(localStorage.getItem(EVENT_KEY)||"[]")}catch{return[]}}
  function saveEvents(a){localStorage.setItem(EVENT_KEY,JSON.stringify(a))}
  function loadCountdowns(){try{return JSON.parse(localStorage.getItem(COUNTDOWN_KEY)||"[]")}catch{return[]}}
  function saveCountdowns(a){localStorage.setItem(COUNTDOWN_KEY,JSON.stringify(a))}
  function eventColor(type){return COLORS[type]||COLORS.custom}
  function eventMatches(ev,y,m,d){
    const base=dateObj(ev.y,ev.m,ev.d),cur=dateObj(y,m,d),diff=Math.round((Date.UTC(y,m,d)-Date.UTC(ev.y,ev.m,ev.d))/86400000);
    if(diff<0)return false;
    if(ev.repeat==="none")return diff===0;
    if(ev.repeat==="daily")return true;
    if(ev.repeat==="weekly")return diff%7===0;
    if(ev.repeat==="monthly")return d===ev.d;
    if(ev.repeat==="yearly")return m===ev.m&&d===ev.d;
    return iso(ev.y,ev.m,ev.d)===iso(y,m,d);
  }
  function eventsFor(y,m,d){return loadEvents().filter(e=>eventMatches(e,y,m,d))}
  function eventLabel(ev,y){
    let text=ev.note||"Note";
    if(ev.repeat==="yearly"&&ev.age){
      const age=y-ev.y;
      if(age>=0) text+=` · ${age} year${age===1?"":"s"}`;
    }
    return text;
  }
  function nthWeekday(year,month,weekday,n){const first=new Date(year,month-1,1).getDay();return 1+((weekday-first+7)%7)+(n-1)*7}
  function lastWeekday(year,month,weekday){const last=new Date(year,month,0).getDate();const d=new Date(year,month-1,last).getDay();return last-((d-weekday+7)%7)}
  function easter(year){
    const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
    return{month,day};
  }
  function holidays(y,m){
    const out={};
    const add=(mm,d,n)=>{if(mm===m)out[d]=n};
    Object.entries(fixedHolidays).forEach(([k,n])=>{const [mm,d]=k.split("-").map(Number);add(mm,d,n)});
    if(m===0)add(0,nthWeekday(y,1,1,3),"Martin Luther King Jr. Day");
    if(m===1)add(1,nthWeekday(y,2,1,3),"Presidents' Day");
    if(m===4)add(4,lastWeekday(y,5,1),"Memorial Day");
    if(m===5)add(5,nthWeekday(y,6,0,3),"Father's Day");
    if(m===8)add(8,nthWeekday(y,9,1,1),"Labor Day");
    if(m===10)add(10,nthWeekday(y,11,4,4),"Thanksgiving Day");
    const e=easter(y); if(e.month-1===m)add(m,e.day,"Easter Sunday");
    return out;
  }

  function centeredIndex(el){
    if(!el.children.length)return 0;
    const first=el.children[0], row=first.offsetHeight||52, center=el.scrollTop+el.clientHeight/2;
    return Math.max(0,Math.min(el.children.length-1,Math.round((center-first.offsetTop-row/2)/row)));
  }
  function centerIndex(el,index,behavior="smooth"){
    const item=el.children[index]; if(!item)return;
    el.scrollTo({top:Math.max(0,item.offsetTop-(el.clientHeight-item.offsetHeight)/2),behavior});
  }
  function updateSelected(el){
    const idx=centeredIndex(el);
    for(let i=Math.max(0,idx-3);i<=Math.min(el.children.length-1,idx+3);i++)el.children[i].classList.toggle("selected",i===idx);
  }
  function makeWheel(el,values,selectedIndex,formatter,onSelect,circular=false){
    el.innerHTML="";
    const base=values.length, arr=circular?Array.from({length:base*WHEEL_CYCLES},(_,i)=>values[i%base]):values;
    arr.forEach((v,i)=>{
      const item=document.createElement("div");item.className="wheel-item";item.textContent=formatter(v);item.dataset.i=i;
      item.addEventListener("click",()=>centerIndex(el,i));
      el.appendChild(item);
    });
    requestAnimationFrame(()=>{const idx=circular?MID*base+selectedIndex:selectedIndex;centerIndex(el,idx,"auto");updateSelected(el)});
    clearTimeout(el._timer);
    el.onscroll=()=>{
      updateSelected(el);clearTimeout(el._timer);
      el._timer=setTimeout(()=>{
        let idx=centeredIndex(el);
        if(circular){
          const logical=((idx%base)+base)%base;onSelect(values[logical]);
          const cycle=Math.floor(idx/base);
          if(cycle<=1||cycle>=WHEEL_CYCLES-2){idx=MID*base+logical;centerIndex(el,idx,"auto")}
        }else onSelect(values[idx]);
        updateSelected(el);
      },140);
    };
  }

  function rebuildWheels(){
    const max=daysInMonth(state.year,state.month);if(state.day>max)state.day=max;
    const years=Array.from({length:YEAR_MAX-YEAR_MIN+1},(_,i)=>YEAR_MIN+i);
    makeWheel($("yearWheel"),years,state.year-YEAR_MIN,String,y=>{state.year=y;state.day=Math.min(state.day,daysInMonth(state.year,state.month));renderAll();rebuildDayWheel();},false);
    makeWheel($("monthWheel"),MONTHS,state.month,v=>{state.month=MONTHS.indexOf(v);state.day=Math.min(state.day,daysInMonth(state.year,state.month));renderAll();rebuildDayWheel();},true);
    rebuildDayWheel();
  }
  function rebuildDayWheel(){
    const max=daysInMonth(state.year,state.month),days=Array.from({length:max},(_,i)=>i+1);
    makeWheel($("dayWheel"),days,state.day-1,String,d=>{state.day=d;renderAll();scrollToCalendar()},true);
  }

  function renderCalendar(){
    const y=state.year,m=state.month,h=holidays(y,m);
    $("calTitle").textContent=`${MONTHS[m]} ${y}`;
    $("calSubtitle").textContent=`Selected day: ${state.day}`;
    $("week").innerHTML=WEEKDAYS.map(d=>`<div>${d.slice(0,3)}</div>`).join("");
    const first=new Date(y,m,1).getDay(),count=daysInMonth(y,m),cells=[];
    for(let i=0;i<first;i++)cells.push(`<div class="day empty"></div>`);
    for(let d=1;d<=count;d++){
      const evs=eventsFor(y,m,d),holiday=h[d];
      const cls=["day"];if(d===state.day)cls.push("selected");if(holiday)cls.push("holiday");if(evs.length)cls.push("has-event");
      const label=evs[0]?eventLabel(evs[0],y):"";
      cells.push(`<button type="button" class="${cls.join(" ")}" data-day="${d}" style="${evs[0]?`--event-color:${eventColor(evs[0].type)}`:""}"><span class="day-num">${d}</span>${label?`<span class="calendar-event">${esc(label)}</span>`:""}${holiday?`<span class="holiday-name">${esc(holiday)}</span>`:""}</button>`);
    }
    $("days").innerHTML=cells.join("");
    $("days").querySelectorAll("[data-day]").forEach(btn=>btn.addEventListener("click",()=>{state.day=Number(btn.dataset.day);renderAll();openDateNotes();scrollToCalendar()}));
  }

  function renderInfo(){
    const h=holidays(state.year,state.month)[state.day],evs=eventsFor(state.year,state.month,state.day);
    const date=dateObj(state.year,state.month,state.day);
    let text=`<strong>${date.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</strong>`;
    if(h)text+=` · ${esc(h)}`;
    $("dateInfo").innerHTML=`${text}<div class="info-actions"><button class="info-action plus" id="infoNotes">Notes${evs.length?` (${evs.length})`:""}</button><button class="info-action" id="infoAdd">＋ Add note</button></div>`;
    $("infoNotes").onclick=openDateNotes;$("infoAdd").onclick=()=>openEditor(false);
  }

  function renderYearView(){
    const y=state.year; $("yearViewTitle").textContent=String(y);
    const names=["S","M","T","W","T","F","S"];let html="",noteItems=[];
    for(let m=0;m<12;m++){
      const h=holidays(y,m),count=daysInMonth(y,m),first=new Date(y,m,1).getDay(),evDates=[];
      for(let d=1;d<=count;d++)if(eventsFor(y,m,d).length)evDates.push(d);
      let cells="";
      for(let i=0;i<first;i++)cells+=`<span></span>`;
      for(let d=1;d<=count;d++){
        const has=eventsFor(y,m,d).length,cls=["mini-day"];if(has)cls.push("note-day");if(h[d])cls.push("holiday-day");
        if(y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate())cls.push("today-day");
        cells+=`<button type="button" class="${cls.join(" ")}" data-mini-date="${m}-${d}">${d}${has?'<i class="note-dot"></i>':""}</button>`;
        eventsFor(y,m,d).forEach(ev=>noteItems.push({m,d,ev}));
      }
      html+=`<article class="mini-month"><div class="mini-month-title">${MONTHS[m]}</div><div class="mini-week">${names.map(n=>`<span>${n}</span>`).join("")}</div><div class="mini-days">${cells}</div></article>`;
    }
    $("yearGrid").innerHTML=html;
    $("yearGrid").querySelectorAll("[data-mini-date]").forEach(b=>b.onclick=()=>{const [m,d]=b.dataset.miniDate.split("-").map(Number);state.month=m;state.day=d;renderAll();setView("month");scrollToCalendar()});
    $("yearNoteList").innerHTML=noteItems.length
      ? noteItems.map(x=>`<div class="year-note-item"><div class="year-note-date">${MONTHS[x.m].slice(0,3)} ${x.d}</div><div class="year-note-text">${esc(eventLabel(x.ev,y))}</div></div>`).join("")
      : `<div class="empty-countdowns">No notes in ${y}.</div>`;
  }

  function renderSelectedDate(){ $("selectedDate").innerHTML=`Selected date: <strong>${dateObj(state.year,state.month,state.day).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}</strong>` }
  function renderAll(){renderSelectedDate();renderCalendar();renderInfo();if(calendarView==="year")renderYearView();renderCountdowns()}

  function scrollToCalendar(){
    setTimeout(()=>$("calendarCard").scrollIntoView({behavior:"smooth",block:"start"}),80);
  }

  function setView(view){
    calendarView=view;
    $("monthViewBtn").classList.toggle("active",view==="month");
    $("yearViewBtn").classList.toggle("active",view==="year");
    $("yearView").classList.toggle("open",view==="year");
    renderAll();
    setTimeout(()=>$("calendarCard").scrollIntoView({behavior:"smooth",block:"start"}),80);
  }

  function openModal(){ $("editorBackdrop").classList.add("open");$("eventEditor").classList.add("open") }
  function closeModal(){ $("editorBackdrop").classList.remove("open");$("eventEditor").classList.remove("open");editingId=null }
  function updateCategoryButtons(){
    document.querySelectorAll(".quick-add-btn").forEach(b=>b.classList.toggle("active",b.dataset.quick===selectedType));
  }
  function updateCountdownFields(){
    const on=$("countdownToggle").checked,btn=$("countdownClockButton");
    btn.disabled=!on;btn.classList.toggle("enabled",on);btn.title=on?"Set countdown time":"Select Add countdown clock first";
  }

  function renderDateNoteList(){
    const evs=eventsFor(state.year,state.month,state.day);
    $("editorTitle").textContent=`Notes for ${MONTHS[state.month]} ${state.day}, ${state.year}`;
    $("dateNoteList").innerHTML=evs.length?evs.map(ev=>`<button type="button" class="date-note" data-note-id="${ev.id}"><div class="date-note-title">${esc(eventLabel(ev,state.year))}</div><div class="date-note-meta">${ev.repeat==="none"?"Does not repeat":"Repeats "+ev.repeat}${ev.age?" · tracks years":""}</div></button>`).join(""):`<div class="empty-countdowns">No notes saved on this date.</div>`;
    $("dateNoteList").querySelectorAll("[data-note-id]").forEach(b=>b.onclick=()=>openEditor(true,Number(b.dataset.noteId)));
  }

  function openDateNotes(){editingId=null;$("dateNoteArea").style.display="block";$("noteForm").style.display="none";renderDateNoteList();openModal()}
  function openEditor(edit=false,id=null){
    $("dateNoteArea").style.display="none";$("noteForm").style.display="block";editingId=edit?id:null;
    const ev=edit?loadEvents().find(e=>Number(e.id)===Number(id)):null;
    selectedType=ev?.type||"custom";
    $("noteInput").value=ev?.note||"";$("repeatSelect").value=ev?.repeat||"none";$("ageToggle").checked=!!ev?.age;
    $("deleteNote").disabled=!ev; $("countdownToggle").checked=false;$("countdownTime").value="00:00";
    const c=loadCountdowns().find(x=>Number(x.eventId)===Number(ev?.id));
    if(c){$("countdownToggle").checked=true;$("countdownTime").value=c.time||"00:00"}
    updateCategoryButtons();updateCountdownFields();
    $("editorTitle").textContent=edit?"Edit note":`Add note for ${MONTHS[state.month]} ${state.day}, ${state.year}`;
    $("eventPreview").textContent=ev?`Saved as ${ev.repeat==="none"?"one-time":ev.repeat}${ev.age?" · yearly age/year tracking":""}${c?" · countdown set":""}":"";
    openModal();
  }

  function saveCurrent(){
    const note=$("noteInput").value.trim();if(!note){$("noteInput").focus();return}
    const repeat=$("repeatSelect").value,age=$("ageToggle").checked;
    let events=loadEvents(),id=editingId;
    if(id!==null){
      const i=events.findIndex(e=>Number(e.id)===Number(id));
      if(i>=0)events[i]={...events[i],y:state.year,m:state.month,d:state.day,note,repeat,age,type:selectedType};
    }else{
      id=Date.now()+Math.floor(Math.random()*1000);
      events.push({id,y:state.year,m:state.month,d:state.day,note,repeat,age,type:selectedType});
    }
    saveEvents(events);
    let cds=loadCountdowns().filter(c=>Number(c.eventId)!==Number(id));
    if($("countdownToggle").checked){
      const time=$("countdownTime").value||"00:00";
      cds.push({id:`c-${id}`,eventId:id,y:state.year,m:state.month,d:state.day,time,title:note,color:eventColor(selectedType)});
    }
    saveCountdowns(cds);
    closeModal();renderAll();scrollToCalendar();
  }

  function deleteCurrent(){
    if(editingId===null)return;
    saveEvents(loadEvents().filter(e=>Number(e.id)!==Number(editingId)));
    saveCountdowns(loadCountdowns().filter(c=>Number(c.eventId)!==Number(editingId)));
    closeModal();renderAll();scrollToCalendar();
  }

  function localCountdownTarget(c){
    const [h,m]=(c.time||"00:00").split(":").map(Number);return dateObj(c.y,c.m,c.d,h||0,m||0);
  }
  function renderCountdowns(){
    const all=loadCountdowns(),now2=new Date(),active=all.filter(c=>localCountdownTarget(c)>now2).sort((a,b)=>localCountdownTarget(a)-localCountdownTarget(b));
    $("countdownCount").textContent=`${active.length} active`;
    if(!active.length){$("countdownList").innerHTML='<div class="empty-countdowns">No active countdown clocks yet. Pick a future date, add a note, and turn on “Add countdown clock.”</div>';return}
    $("countdownList").innerHTML=active.map(c=>{
      let ms=localCountdownTarget(c)-now2,days=Math.floor(ms/86400000);ms%=86400000;
      let hours=Math.floor(ms/3600000);ms%=3600000;let mins=Math.floor(ms/60000);ms%=60000;let secs=Math.floor(ms/1000);
      const target=localCountdownTarget(c).toLocaleString(undefined,{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
      return `<article class="countdown-card" style="--card-color:${c.color||COLORS.custom}"><button class="delete-countdown" type="button" data-countdown-id="${esc(c.id)}">×</button><div class="countdown-title">${esc(c.title||"Countdown")}</div><div class="countdown-target">Until ${target}</div><div class="countdown-time"><div class="countdown-unit"><div class="countdown-number">${String(days).padStart(2,"0")}</div><div class="countdown-label">Days</div></div><div class="countdown-unit"><div class="countdown-number">${String(hours).padStart(2,"0")}</div><div class="countdown-label">Hours</div></div><div class="countdown-unit"><div class="countdown-number">${String(mins).padStart(2,"0")}</div><div class="countdown-label">Min</div></div><div class="countdown-unit"><div class="countdown-number">${String(secs).padStart(2,"0")}</div><div class="countdown-label">Sec</div></div></div></article>`;
    }).join("");
    $("countdownList").querySelectorAll(".delete-countdown").forEach(b=>b.onclick=()=>{saveCountdowns(loadCountdowns().filter(c=>String(c.id)!==String(b.dataset.countdownId)));renderCountdowns()});
  }

  $("todayBtn").onclick=()=>{const n=new Date();state.year=n.getFullYear();state.month=n.getMonth();state.day=n.getDate();rebuildWheels();renderAll();scrollToCalendar()};
  $("yearTodayBtn").onclick=$("todayBtn").onclick;
  $("prevMonth").onclick=()=>{if(state.month===0){if(state.year>YEAR_MIN){state.year--;state.month=11}else return}else state.month--;state.day=Math.min(state.day,daysInMonth(state.year,state.month));rebuildWheels();renderAll();scrollToCalendar()};
  $("nextMonth").onclick=()=>{if(state.month===11){if(state.year<YEAR_MAX){state.year++;state.month=0}else return}else state.month++;state.day=Math.min(state.day,daysInMonth(state.year,state.month));rebuildWheels();renderAll();scrollToCalendar()};
  $("monthViewBtn").onclick=()=>setView("month");$("yearViewBtn").onclick=()=>setView("year");
  $("closeEditor").onclick=closeModal;$("editorBackdrop").onclick=closeModal;$("clearEvent").onclick=closeModal;
  $("addNoteBtn").onclick=()=>openEditor(false);$("saveEvent").onclick=saveCurrent;$("deleteNote").onclick=deleteCurrent;
  document.querySelectorAll(".quick-add-btn").forEach(b=>b.onclick=()=>{selectedType=b.dataset.quick;updateCategoryButtons()});
  $("countdownToggle").onchange=updateCountdownFields;
  $("countdownClockButton").onclick=()=>{
    if(!$("countdownToggle").checked)return;
    const input=$("countdownTime");
    try{if(typeof input.showPicker==="function")input.showPicker();else input.click()}catch{input.click()}
  };
  $("countdownTime").onchange=()=>{if($("countdownToggle").checked)$("eventPreview").textContent=`Countdown time: ${$("countdownTime").value}`};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("eventEditor").classList.contains("open"))closeModal()});
  setInterval(renderCountdowns,1000);

  rebuildWheels();renderAll();
})();
</script>
</body>
</html>
