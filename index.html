<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perpetual Calendar</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --panel2:#1c2430; --text:#f4f7fb;
    --muted:#9da9b8; --accent:#7c9cff; --accent2:#9c7cff;
    --line:#2a3442; --today:#283c66; --holiday:#332744;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text); background:
      radial-gradient(circle at 20% 0%, #1d2740 0, transparent 34%),
      radial-gradient(circle at 90% 20%, #241a3a 0, transparent 30%), var(--bg);
  }
  .app{width:min(1100px,94vw);margin:0 auto;padding:28px 0 44px}
  header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}
  h1{font-size:clamp(1.6rem,4vw,2.5rem);margin:0;letter-spacing:-.04em}
  .subtitle{color:var(--muted);margin-top:5px}
  button,select{font:inherit}
  button{
    border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:12px;
    padding:10px 14px; cursor:pointer; transition:.15s;
  }
  button:hover{background:var(--panel2);transform:translateY(-1px)}
  .today-btn{border-color:#526da9;background:#1a2640}
  .picker{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px;
    background:rgba(21,27,36,.88);border:1px solid var(--line);border-radius:22px;
    backdrop-filter:blur(12px); margin-bottom:18px;
  }
  .wheel-wrap{position:relative;text-align:center}
  .wheel-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
  .wheel{
    position:relative;height:190px; overflow-y:auto; scroll-snap-type:none; scrollbar-width:none;
    -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; touch-action:pan-y;
    border-radius:16px; background:linear-gradient(180deg,var(--panel2),#111720);
    border:1px solid var(--line); padding:67px 0;
  }
  .wheel::-webkit-scrollbar{display:none}
  #yearWheel .wheel-item{height:42px}
  .wheel::before,.wheel::after{content:"";position:absolute;left:10px;right:10px;height:56px;pointer-events:none;z-index:2}
  .wheel::before{top:0;background:linear-gradient(var(--panel),transparent)}
  .wheel::after{bottom:0;background:linear-gradient(transparent,var(--panel))}
  .wheel-item{
    height:52px;display:flex;align-items:center;justify-content:center;
    
    color:#687586;font-size:1.05rem;transition:color .12s,transform .12s;
    user-select:none;-webkit-user-select:none;
  }
  .wheel-item.selected{color:var(--text);font-size:1.3rem;font-weight:700}
  .wheel-highlight{
    position:absolute;left:10px;right:10px;top:88px;height:56px;
    border-top:2px solid #52617a;border-bottom:2px solid #52617a;border-radius:10px;
    pointer-events:none;z-index:3;box-shadow:0 0 18px rgba(124,156,255,.08);
  }
  .calendar-card{background:rgba(21,27,36,.9);border:1px solid var(--line);border-radius:24px;padding:22px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .cal-title{text-align:center;flex:1}
  .cal-title h2{margin:0;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:-.03em}
  .cal-title p{margin:4px 0 0;color:var(--muted)}
  .week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .week div{text-align:center;color:var(--muted);font-size:.76rem;text-transform:uppercase;padding:8px 0}
  .day{
    min-height:74px;border:1px solid var(--line);border-radius:12px;background:#121821;
    padding:8px;position:relative;cursor:pointer;
  }
  .day:hover{background:#1a222e}
  .day.empty{background:transparent;border-color:transparent;cursor:default}
  .day-num{font-weight:650}
  .day.selected{outline:2px solid var(--accent);background:var(--today)}
  .day.holiday{background:var(--holiday)}
  .holiday-name{position:absolute;left:7px;right:5px;bottom:6px;color:#d6b9ff;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;margin-top:16px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--holiday);border:1px solid #755a91}
  .info{margin-top:18px;padding:15px 17px;background:#111720;border:1px solid var(--line);border-radius:16px;color:var(--muted)}
  .info strong{color:var(--text)}
  @media(max-width:650px){
    .app{padding-top:18px}
    header{align-items:flex-start}
    .picker{gap:7px;padding:10px}
    .wheel{height:174px;padding:59px 0}
    .wheel-highlight{top:80px}
    .wheel-item{height:52px;font-size:.92rem}
    .wheel-item.selected{font-size:1.1rem}
    .day{min-height:62px;padding:6px;font-size:.88rem}
    .holiday-name{font-size:.58rem}
    .calendar-card{padding:12px}
    .cal-head button{padding:8px 10px}
  }

  .editor-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);
    z-index:90;backdrop-filter:blur(3px);
  }
  .editor-backdrop.open{display:block}
  .event-panel{
    margin-top:18px;padding:18px;background:#111720;border:1px solid var(--line);border-radius:18px
  }
  .event-panel.modal-editor{
    display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(720px,92vw);max-height:88vh;overflow:auto;margin:0;z-index:100;
    box-shadow:0 24px 80px rgba(0,0,0,.55);border-color:#3b4b63;
  }
  .event-panel.modal-editor.open{display:block}
  .editor-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;
  }
  .editor-head h3{margin:0}
  .close-editor{
    width:42px;height:42px;border-radius:12px;padding:0;font-size:1.35rem;
    background:#202936;border-color:#3a4658;
  }
  .date-note-list{margin-top:12px;display:grid;gap:8px}
  .date-note{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#111720;
  }
  .date-note-text{min-width:0}
  .date-note-title{font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .date-note-meta{font-size:.76rem;color:var(--muted);margin-top:3px}
  .add-note-btn{
    margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    border-color:#526da9;background:#1b2944;font-weight:750;
  }
  .info-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .info-action{
    border-radius:10px;padding:7px 10px;font-size:.82rem;background:#182236;border-color:#3c537c;
  }
  .info-action.plus{font-weight:750}

  .event-panel h3{margin:0 0 12px;font-size:1.05rem}
  .event-grid{display:grid;grid-template-columns:1fr 180px;gap:12px}
  .notes{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#151b24;color:var(--text);padding:12px;font:inherit;outline:none}
  .notes:focus,.repeat-select:focus{border-color:var(--accent)}
  .repeat-select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#151b24;color:var(--text);padding:0 10px;font:inherit}
  .event-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .save-event{background:#24345c;border-color:#526da9;font-weight:700}
  .delete-note{background:#3a2028;border-color:#75404c;color:#ffdce2;font-weight:750;min-width:42px;padding:10px 13px}
  .delete-note:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .age-toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem}
  .event-preview{margin-top:12px;color:var(--muted);font-size:.88rem;line-height:1.45}
  .calendar-event{position:absolute;left:7px;right:5px;bottom:6px;color:#c9d7ff;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day.has-event{background:#182844;border-color:#45649e}
  @media(max-width:650px){.event-grid{grid-template-columns:1fr}.event-panel{padding:14px}}
  .countdown-option{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.9rem;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#151b24}.countdown-option input{width:18px;height:18px;accent-color:var(--accent)}
  .countdown-fields{display:grid;grid-template-columns:1fr 150px 130px;gap:10px;margin-top:10px}.countdown-fields input,.countdown-fields select{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:#151b24;color:var(--text);padding:0 11px;font:inherit;outline:none}.countdown-fields input:focus,.countdown-fields select:focus{border-color:var(--accent)}.countdown-hint{margin-top:8px;color:var(--muted);font-size:.78rem}
  .countdowns-panel{margin-top:18px;padding:18px;background:#111720;border:1px solid var(--line);border-radius:18px}.countdowns-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.countdowns-head h3{margin:0;font-size:1.05rem}.countdowns-head span{color:var(--muted);font-size:.8rem}.countdown-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.countdown-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#171f2a,#111720);padding:16px}.countdown-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--card-color,#7c9cff)}.countdown-title{font-size:1.05rem;font-weight:750;padding-left:5px;padding-right:28px}.countdown-target{color:var(--muted);font-size:.8rem;margin:5px 0 13px;padding-left:5px}.countdown-time{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-left:5px}.countdown-unit{background:#0e141c;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}.countdown-number{font-size:1.15rem;font-weight:800;line-height:1.1}.countdown-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}.delete-countdown{position:absolute;right:10px;top:9px;border:0;background:transparent;padding:4px 7px;color:var(--muted);font-size:1.1rem}.delete-countdown:hover{color:var(--text);background:#242d3a;transform:none}.empty-countdowns{color:var(--muted);padding:10px 2px}
  @media(max-width:650px){.countdown-fields{grid-template-columns:1fr 1fr}.countdown-fields input:first-child{grid-column:1/-1}.countdown-list{grid-template-columns:1fr}.countdowns-panel{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Perpetual Calendar</h1>
      <div class="subtitle">Explore dates from 1500 through 3000 and beyond.</div>
    </div>
    <button class="today-btn" id="todayBtn">Today</button>
  </header>

  <section class="picker" aria-label="Date picker">
    <div class="wheel-wrap">
      <div class="wheel-label">Year</div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="yearWheel"></div>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-label">Month</div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="monthWheel"></div>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-label">Day</div>
      <div class="wheel-highlight"></div>
      <div class="wheel" id="dayWheel"></div>
    </div>
  </section>

  <section class="calendar-card">
    <div class="cal-head">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <div class="cal-title">
        <h2 id="monthTitle"></h2>
        <p id="dateDescription"></p>
      </div>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="week" id="week"></div>
    <div class="days" id="days"></div>
    <div class="legend"><span><span class="dot"></span>Holiday / observance</span></div>
    <div class="info" id="info"></div>

    <div class="editor-backdrop" id="editorBackdrop"></div>
    <div class="event-panel modal-editor" id="eventEditor">
      <div class="editor-head">
        <h3>Notes &amp; Repeat</h3>
        <button class="close-editor" id="closeEditor" aria-label="Close notes">×</button>
      </div>
      <div class="event-grid">
        <textarea class="notes" id="noteInput" placeholder="Write a note for this date…"></textarea>
        <select class="repeat-select" id="repeatSelect" aria-label="Repeat">
          <option value="none">Does not repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <div class="event-actions">
        <label class="age-toggle"><input type="checkbox" id="ageToggle"> Track age on yearly repeats</label>
        <label class="countdown-option"><input type="checkbox" id="countdownToggle"> Add countdown clock</label>
        <button class="save-event" id="saveEvent">Save note</button>
        <button class="delete-note" id="deleteNote" title="Delete saved note for this date" aria-label="Delete saved note" disabled>✕</button>
        <button id="clearEvent">Clear</button>
      </div>
      <div class="countdown-fields" id="countdownFields" hidden>
        <input id="countdownTitle" type="text" placeholder="Countdown title (e.g. Retirement)">
        <input id="countdownTime" type="time" value="00:00" aria-label="Countdown time">
        <select id="countdownColor" aria-label="Countdown color">
          <option value="#7c9cff">Blue</option><option value="#9c7cff">Purple</option><option value="#5ac8a8">Green</option><option value="#e5a84b">Gold</option><option value="#e56b7d">Rose</option><option value="#55b9d6">Cyan</option>
        </select>
      </div>
      <div class="countdown-hint" id="countdownHint" hidden>Countdowns are saved for future dates and appear in your Countdown Clocks below.</div>
      <div class="event-preview" id="eventPreview"></div>
    </div>
    <section class="countdowns-panel" aria-label="Countdown Clocks">
      <div class="countdowns-head"><h3>Countdown Clocks</h3><span id="countdownCount"></span></div>
      <div class="countdown-list" id="countdownList"></div>
    </section>
  </section>
</div>

<script>
(() => {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  // Built-in U.S. holiday rules. The calendar engine itself is perpetual;
  // holiday rules can be expanded or replaced with a historical holiday database.
  const fixedHolidays = {
    "1-1":"New Year's Day","2-14":"Valentine's Day","7-4":"Independence Day",
    "10-31":"Halloween","12-25":"Christmas Day"
  };

  function nthWeekday(year, month, weekday, n){
    const first = new Date(year, month-1, 1).getDay();
    return 1 + ((weekday - first + 7) % 7) + (n-1)*7;
  }
  function lastWeekday(year, month, weekday){
    const last = new Date(year, month, 0).getDate();
    const d = new Date(year, month-1, last).getDay();
    return last - ((d-weekday+7)%7);
  }
  function easterSunday(year){
    // Gregorian computus
    const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
    const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
    const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
    const m=Math.floor((a+11*h+22*l)/451);
    const month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return {month,day};
  }
  function holidays(year, month){
    const out = {};
    const add=(m,d,name)=>{ if(m===month) out[d]=name; };
    Object.entries(fixedHolidays).forEach(([key,name])=>{
      const [m,d]=key.split("-").map(Number); add(m,d,name);
    });
    if(month===1) add(1,nthWeekday(year,1,1,3),"Martin Luther King Jr. Day");
    if(month===2) add(2,nthWeekday(year,2,1,3),"Presidents' Day");
    if(month===5) add(5,lastWeekday(year,5,1),"Memorial Day");
    if(month===6) add(6,nthWeekday(year,6,0,3),"Father's Day");
    if(month===9) add(9,nthWeekday(year,9,1,1),"Labor Day");
    if(month===11) add(11,nthWeekday(year,11,4,4),"Thanksgiving Day");
    const easter=easterSunday(year);
    if(easter.month===month) add(month,easter.day,"Easter Sunday");
    return out;
  }

  let selected = new Date();
  selected.setHours(12,0,0,0);
  const state = {year:selected.getFullYear(), month:selected.getMonth(), day:selected.getDate()};

  const yearWheel=document.getElementById("yearWheel");
  const monthWheel=document.getElementById("monthWheel");
  const dayWheel=document.getElementById("dayWheel");

  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }

  const WHEEL_CYCLES = 9;
  const WHEEL_CENTER_CYCLE = Math.floor(WHEEL_CYCLES/2);
  const YEAR_MIN = 1500, YEAR_MAX = 3000;

  function centerIndex(el,index,behavior="smooth"){
    const item=el.children[index];
    if(!item) return;
    const target=item.offsetTop-(el.clientHeight-item.offsetHeight)/2;
    el.scrollTo({top:Math.max(0,target),behavior});
  }

  function centeredIndex(el){
    const first=el.children[0];
    if(!first) return 0;
    const row=first.offsetHeight || 52;
    const center=el.scrollTop+el.clientHeight/2;
    return Math.max(0,Math.min(el.children.length-1,Math.round((center-first.offsetTop-row/2)/row)));
  }

  function makeWheel(el,values,selectedIndex,formatter,onSelect,opts={}){
    el.innerHTML="";
    const base=values.length;
    const circular=!!opts.circular;
    const renderValues=circular ? Array.from({length:base*WHEEL_CYCLES},(_,i)=>values[i%base]) : values;
    renderValues.forEach((value,i)=>{
      const item=document.createElement("div");
      item.className="wheel-item";
      item.textContent=formatter(value);
      item.dataset.index=i;
      item.addEventListener("click",()=>centerIndex(el,i,"smooth"));
      el.appendChild(item);
    });

    const initialIndex=circular ? WHEEL_CENTER_CYCLE*base+selectedIndex : selectedIndex;
    requestAnimationFrame(()=>{centerIndex(el,initialIndex,"auto");updateSelected(el);});

    let timer;
    el.onscroll=()=>{
      updateSelected(el);
      clearTimeout(timer);
      timer=setTimeout(()=>{
        let index=centeredIndex(el);
        if(circular){
          const logical=((index%base)+base)%base;
          onSelect(values[logical]);
          const cycle=Math.floor(index/base);
          if(cycle<=1 || cycle>=WHEEL_CYCLES-2){
            const middle=WHEEL_CENTER_CYCLE*base+logical;
            centerIndex(el,middle,"auto");
            index=middle;
          }
        }else{
          onSelect(values[index]);
        }
        centerIndex(el,index,"smooth");
        updateSelected(el);
      },180);
    };
  }

  function updateSelected(el){
    const index=centeredIndex(el);
    const lo=Math.max(0,index-3), hi=Math.min(el.children.length-1,index+3);
    for(let i=lo;i<=hi;i++) el.children[i].classList.toggle("selected",i===index);
  }

  function rebuildWheels(){
    const maxDay=daysInMonth(state.year,state.month);
    if(state.day>maxDay) state.day=maxDay;
    const years=Array.from({length:YEAR_MAX-YEAR_MIN+1},(_,i)=>YEAR_MIN+i);
    makeWheel(yearWheel,years,state.year-YEAR_MIN,String,y=>{
      state.year=y;
      const max=daysInMonth(state.year,state.month);
      if(state.day>max) state.day=max;
      render();
      rebuildDayWheel();
    });
    makeWheel(monthWheel,MONTHS,state.month,m=>m,m=>{
      state.month=MONTHS.indexOf(m);
      const max=daysInMonth(state.year,state.month);
      if(state.day>max) state.day=max;
      render();
      rebuildDayWheel();
    },{circular:true});
    rebuildDayWheel();
  }

  function rebuildDayWheel(){
    const max=daysInMonth(state.year,state.month);
    if(state.day>max) state.day=max;
    const days=Array.from({length:max},(_,i)=>i+1);
    makeWheel(dayWheel,days,state.day-1,String,d=>{state.day=d;render();},{circular:true});
  }


  const EVENT_KEY="perpetualCalendarEvents_v1";
  const COUNTDOWN_KEY="perpetualCalendarCountdowns_v1";
  function loadEvents(){try{return JSON.parse(localStorage.getItem(EVENT_KEY)||"[]")}catch{return []}}
  function saveEvents(list){localStorage.setItem(EVENT_KEY,JSON.stringify(list))}
  function loadCountdowns(){try{return JSON.parse(localStorage.getItem(COUNTDOWN_KEY)||"[]")}catch{return []}}
  function saveCountdowns(list){localStorage.setItem(COUNTDOWN_KEY,JSON.stringify(list))}
  function iso(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
  function daysBetween(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)}
  function eventMatches(ev,y,m,d){const base=new Date(ev.y,ev.m,ev.d),cur=new Date(y,m,d),diff=daysBetween(base,cur);if(diff<0)return false;if(ev.repeat==="none")return diff===0;if(ev.repeat==="daily")return true;if(ev.repeat==="weekly")return diff%7===0;if(ev.repeat==="monthly")return d===ev.d&&(y*12+m)-(ev.y*12+ev.m)>=0;if(ev.repeat==="yearly")return m===ev.m&&d===ev.d;return false}
  function eventsFor(y,m,d){return loadEvents().filter(ev=>eventMatches(ev,y,m,d))}
  function eventLabel(ev,y){let text=ev.note||"Note";if(ev.repeat==="yearly"&&ev.age){const age=y-ev.y;if(age>=0)text+=` · ${age} year${age===1?"":"s"}`}return text}
  function localTarget(c){const [hh,mm]=(c.time||"00:00").split(":").map(Number);return new Date(c.y,c.m,c.d,hh||0,mm||0,0,0)}
  function esc(v){return String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
  function renderCountdowns(){
    const listEl=document.getElementById("countdownList"),countEl=document.getElementById("countdownCount");
    const now=new Date(), active=loadCountdowns().filter(c=>localTarget(c)>now).sort((a,b)=>localTarget(a)-localTarget(b));
    countEl.textContent=`${active.length} active`;
    if(!active.length){listEl.innerHTML='<div class="empty-countdowns">No active countdown clocks yet. Pick a future date, add a note, and turn on “Add countdown clock.”</div>';return}
    listEl.innerHTML=active.map(c=>{let ms=localTarget(c)-now;const days=Math.floor(ms/86400000);ms%=86400000;const hours=Math.floor(ms/3600000);ms%=3600000;const mins=Math.floor(ms/60000);ms%=60000;const secs=Math.floor(ms/1000);const target=localTarget(c).toLocaleString(undefined,{month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});return `<article class="countdown-card" style="--card-color:${c.color||"#7c9cff"}"><button class="delete-countdown" data-countdown-id="${c.id}" title="Delete countdown" aria-label="Delete countdown">×</button><div class="countdown-title">${esc(c.title||"Countdown")}</div><div class="countdown-target">Until ${target}</div><div class="countdown-time"><div class="countdown-unit"><div class="countdown-number">${String(days).padStart(2,"0")}</div><div class="countdown-label">Days</div></div><div class="countdown-unit"><div class="countdown-number">${String(hours).padStart(2,"0")}</div><div class="countdown-label">Hours</div></div><div class="countdown-unit"><div class="countdown-number">${String(mins).padStart(2,"0")}</div><div class="countdown-label">Min</div></div><div class="countdown-unit"><div class="countdown-number">${String(secs).padStart(2,"0")}</div><div class="countdown-label">Sec</div></div></div></article>`}).join("");
    document.querySelectorAll(".delete-countdown").forEach(btn=>btn.onclick=()=>{saveCountdowns(loadCountdowns().filter(c=>String(c.id)!==String(btn.dataset.countdownId)));renderCountdowns()});
  }
  function refreshEventEditor(){
    const key=iso(state.year,state.month,state.day),ev=loadEvents().find(x=>iso(x.y,x.m,x.d)===key),c=loadCountdowns().find(x=>x.y===state.year&&x.m===state.month&&x.d===state.day);
    document.getElementById("noteInput").value=ev?.note||"";document.getElementById("repeatSelect").value=ev?.repeat||"none";document.getElementById("ageToggle").checked=!!ev?.age;
    document.getElementById("deleteNote").disabled=!ev;
    document.getElementById("countdownToggle").checked=!!c;document.getElementById("countdownTitle").value=c?.title||ev?.note||"";document.getElementById("countdownTime").value=c?.time||"00:00";document.getElementById("countdownColor").value=c?.color||"#7c9cff";updateCountdownFields();
    let p=ev?`Saved note: ${ev.repeat}${ev.age?" · age tracking":""}`:"No saved note for this date.";if(c)p+=` · Countdown: ${c.title||"Untitled"}`;document.getElementById("eventPreview").textContent=p;
  }
  function updateCountdownFields(){const on=document.getElementById("countdownToggle").checked;document.getElementById("countdownFields").hidden=!on;document.getElementById("countdownHint").hidden=!on}
  function openEditor(editExisting){
    const panel=document.getElementById("eventEditor"),back=document.getElementById("editorBackdrop");
    panel.classList.add("open");back.classList.add("open");
    refreshEventEditor();
    if(!editExisting){
      document.getElementById("noteInput").value="";
      document.getElementById("repeatSelect").value="none";
      document.getElementById("ageToggle").checked=false;
      document.getElementById("countdownToggle").checked=false;
      document.getElementById("countdownTitle").value="";
      document.getElementById("countdownTime").value="00:00";
      updateCountdownFields();
      document.getElementById("eventPreview").textContent="Add a note for this date.";
    }
    setTimeout(()=>document.getElementById("noteInput").focus(),80);
  }
  function closeEditor(){
    document.getElementById("eventEditor").classList.remove("open");
    document.getElementById("editorBackdrop").classList.remove("open");
  }
  function wireEvents(){
    document.getElementById("closeEditor").onclick=closeEditor;
    document.getElementById("editorBackdrop").onclick=closeEditor;
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeEditor()});
    document.getElementById("countdownToggle").onchange=updateCountdownFields;
    document.getElementById("saveEvent").onclick=()=>{
      const note=document.getElementById("noteInput").value.trim(),repeat=document.getElementById("repeatSelect").value,age=document.getElementById("ageToggle").checked&&repeat==="yearly",on=document.getElementById("countdownToggle").checked,key=iso(state.year,state.month,state.day);
      const events=loadEvents().filter(x=>iso(x.y,x.m,x.d)!==key);if(note)events.push({y:state.year,m:state.month,d:state.day,note,repeat,age});saveEvents(events);
      let cs=loadCountdowns().filter(c=>!(c.y===state.year&&c.m===state.month&&c.d===state.day));
      if(on){const time=document.getElementById("countdownTime").value||"00:00",[hh,mm]=time.split(":").map(Number),target=new Date(state.year,state.month,state.day,hh,mm,0,0);if(target<=new Date()){alert("A countdown clock needs a future date and time. Please choose a future date.");render();return}cs.push({id:Date.now(),y:state.year,m:state.month,d:state.day,time,title:document.getElementById("countdownTitle").value.trim()||note||"Countdown",color:document.getElementById("countdownColor").value})}
      saveCountdowns(cs);render();refreshEventEditor();renderCountdowns();closeEditor();
    };
    document.getElementById("deleteNote").onclick=()=>{
      const key=iso(state.year,state.month,state.day);
      saveEvents(loadEvents().filter(x=>iso(x.y,x.m,x.d)!==key));
      document.getElementById("noteInput").value="";
      document.getElementById("repeatSelect").value="none";
      document.getElementById("ageToggle").checked=false;
      render();refreshEventEditor();renderCountdowns();closeEditor();
    };
    document.getElementById("clearEvent").onclick=()=>{const key=iso(state.year,state.month,state.day);saveEvents(loadEvents().filter(x=>iso(x.y,x.m,x.d)!==key));saveCountdowns(loadCountdowns().filter(c=>!(c.y===state.year&&c.m===state.month&&c.d===state.day)));render();refreshEventEditor();renderCountdowns();closeEditor()};
  }

  function render(){
    const y=state.year,m=state.month,d=state.day;
    document.getElementById("monthTitle").textContent=`${MONTHS[m]} ${y}`;
    const date=new Date(y,m,d);
    const holidayMap=holidays(y,m+1);
    document.getElementById("dateDescription").textContent=`${WEEKDAYS[date.getDay()]}, ${MONTHS[m]} ${d}, ${y}`;
    document.getElementById("week").innerHTML=WEEKDAYS.map(x=>`<div>${x.slice(0,3)}</div>`).join("");

    const first=new Date(y,m,1).getDay(), total=daysInMonth(y,m);
    const cells=[];
    for(let i=0;i<first;i++) cells.push('<div class="day empty"></div>');
    for(let n=1;n<=total;n++){
      const holiday=holidayMap[n];
      const dayEvents=eventsFor(y,m,n);
      const eventText=dayEvents.length?eventLabel(dayEvents[0],y):"";
      cells.push(`<div class="day ${n===d?'selected ':''}${holiday?'holiday ':''}${dayEvents.length?'has-event':''}" data-day="${n}">
        <div class="day-num">${n}</div>${holiday?`<div class="holiday-name" title="${holiday}">${holiday}</div>`:""}${eventText?`<div class="calendar-event" title="${eventText}">${eventText}</div>`:""}
      </div>`);
    }
    document.getElementById("days").innerHTML=cells.join("");
    document.querySelectorAll(".day[data-day]").forEach(el=>el.addEventListener("click",()=>{
      state.day=Number(el.dataset.day); rebuildDayWheel(); render();
    }));
    const selectedEvents=eventsFor(y,m,d);
    let info=holidayMap[d] ? `<strong>${holidayMap[d]}</strong><br>` : "";
    info += `Selected date: <strong>${WEEKDAYS[date.getDay()]}, ${MONTHS[m]} ${d}, ${y}</strong>.`;
    if(selectedEvents.length) info += `<br><strong>${selectedEvents.map(ev=>eventLabel(ev,y)).join("<br>")}</strong>`;
    const infoEl=document.getElementById("info");
    const savedNotes=eventsFor(y,m,d);
    const noteRows=savedNotes.length ? `<div class="date-note-list">${
      savedNotes.map((ev,i)=>`<div class="date-note">
        <div class="date-note-text">
          <div class="date-note-title">${esc(ev.note||"Note")}</div>
          <div class="date-note-meta">${
          ev.repeat==="yearly" && ev.age
            ? `${Math.max(0,y-ev.y)} years`
            : (ev.repeat==="none" ? "One time" : ev.repeat.charAt(0).toUpperCase()+ev.repeat.slice(1))
        }</div>
        </div>
      </div>`).join("")
    }</div>` : "";
    infoEl.innerHTML=`
      ${holidayMap[d]?`<strong>${holidayMap[d]}</strong><br>`:""}
      Selected date: <strong>${WEEKDAYS[date.getDay()]}, ${MONTHS[m]} ${d}, ${y}</strong>
      ${noteRows}
      <div class="info-actions">
        <button class="info-action plus" id="openNoteEditor">＋ Add note</button>
        ${savedNotes.length?`<button class="info-action" id="editNoteEditor">Edit note</button>`:""}
      </div>`;
    document.getElementById("openNoteEditor").onclick=()=>openEditor(false);
    const editBtn=document.getElementById("editNoteEditor");
    if(editBtn) editBtn.onclick=()=>openEditor(true);
    refreshEventEditor();
    renderCountdowns();
  }

  document.getElementById("prevMonth").onclick=()=>{
    state.month--; if(state.month<0){state.month=11;state.year--;}
    state.day=Math.min(state.day,daysInMonth(state.year,state.month)); rebuildWheels(); render();
  };
  document.getElementById("nextMonth").onclick=()=>{
    state.month++; if(state.month>11){state.month=0;state.year++;}
    state.day=Math.min(state.day,daysInMonth(state.year,state.month)); rebuildWheels(); render();
  };
  document.getElementById("todayBtn").onclick=()=>{
    const now=new Date(); state.year=now.getFullYear();state.month=now.getMonth();state.day=now.getDate();
    rebuildWheels();render();
  };

  // Initial render
  wireEvents();
  rebuildWheels();
  render();
  setInterval(renderCountdowns,1000);
})();
</script>
</body>
</html>
